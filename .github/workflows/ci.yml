name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools (QEMU, busybox, kernel modules)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 busybox-static cpio
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || echo "modules supplémentaires indisponibles : tests concernés ignorés"
      - name: Compile
        run: cc -O2 -Wall -Wextra -Werror -std=c99 diskmedic.c -o diskmedic
      - name: Run tests
        run: ./tests/run_tests.sh
      - name: Run loop-device tests (virtual disk, root)
        run: sudo sh ./tests/run_loop_tests.sh
      - name: Run sector-format tests (512n / 512e / 4Kn, scsi_debug)
        run: sudo sh ./tests/run_sector_tests.sh
      - name: Run NVMe tests (nvme-loop + QEMU virtual machine, root)
        run: sudo sh ./tests/run_nvme_tests.sh
